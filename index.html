<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Visual Huffman</title>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <p class="eyebrow">Visual Huffman</p>
      <h1>Huffman Layout Gallery</h1>
    </header>

    <form class="control-strip" onsubmit="event.preventDefault(); fullHuffman();">
      <input id="Input" type="text" placeholder="Enter text" autocomplete="off">
      <button id="Table" type="button" onclick="showHuffmanTable()">Table</button>
      <button id="Full" type="submit">Build</button>
    </form>

    <section id="huffmanTree" class="frequency-panel" aria-live="polite"></section>
    <section id="HuffmanRoot" class="tree-stage" aria-live="polite"></section>
  </main>

  <script src="HuffNode.js"></script>
  <script src="PriorityQueue.js"></script>
  <script src="script.js"></script>
</body>
</html>
